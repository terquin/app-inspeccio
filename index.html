<script>
lucide.createIcons();

// Actualitza el hint de mida quan canvia la qualitat
document.getElementById('quality-select').addEventListener('change', function() {
    const hints = { '0.5': '~150 KB', '0.7': '~300 KB', '0.85': '~600 KB' };
    document.getElementById('quality-size-hint').textContent = hints[this.value] || '';
});

let map, userMarker, currentLat = null, currentLon = null;
let currentPhotosFiles = [];   // Ara guardarem Blobs comprimits, no File originals
let savedPoints = [];
let editingPointId = null;

let TG_TOKEN   = localStorage.getItem('tg_token')   || '';
let TG_CHAT_ID = localStorage.getItem('tg_chat_id') || '';

// ─────────────────────────────────────────────────────────────
// COMPRESSIÓ D'IMATGE AMB CANVAS
// Redimensiona a màx. 1600px i comprimeix a JPEG amb la qualitat triada.
// Allibera la memòria de l'objecte URL i de l'img temporal just després.
// ─────────────────────────────────────────────────────────────
function compressImage(file, quality, maxDim) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
                if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                else                { width = Math.round(width * maxDim / height); height = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob(blob => {
                canvas.width = 1; canvas.height = 1;
                if (!blob) { reject(new Error('toBlob failed')); return; }

                if (currentLat === null || currentLon === null) { resolve(blob); return; }

                // Injecta GPS amb piexifjs
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const dataUrl = e.target.result; // "data:image/jpeg;base64,..."

                        // Llegim l'EXIF existent (si n'hi ha) per no perdre'l
                        let exifObj = { GPS: {} };
                        try { exifObj = piexif.load(dataUrl); } catch(ex) { exifObj = { GPS: {} }; }

                        // Funció per convertir decimal a [graus, minuts, segons] com a racionals
                        function toRat(val) {
                            val = Math.abs(val);
                            const deg = Math.floor(val);
                            const minF = (val - deg) * 60;
                            const min = Math.floor(minF);
                            const secF = (minF - min) * 60;
                            const secNum = Math.round(secF * 10000);
                            return [[deg, 1], [min, 1], [secNum, 10000]];
                        }

                        exifObj.GPS[piexif.GPSIFD.GPSLatitudeRef]  = currentLat >= 0 ? 'N' : 'S';
                        exifObj.GPS[piexif.GPSIFD.GPSLatitude]      = toRat(currentLat);
                        exifObj.GPS[piexif.GPSIFD.GPSLongitudeRef] = currentLon >= 0 ? 'E' : 'W';
                        exifObj.GPS[piexif.GPSIFD.GPSLongitude]     = toRat(currentLon);
                        exifObj.GPS[piexif.GPSIFD.GPSMapDatum]      = 'WGS-84';

                        const exifBytes = piexif.dump(exifObj);
                        const newDataUrl = piexif.insert(exifBytes, dataUrl);

                        // Convertim dataUrl → Blob
                        const bin = atob(newDataUrl.split(',')[1]);
                        const arr = new Uint8Array(bin.length);
                        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                        resolve(new Blob([arr], { type: 'image/jpeg' }));
                    } catch (err) {
                        console.warn('EXIF inject error:', err);
                        resolve(blob); // fallback sense GPS
                    }
                };
                reader.readAsDataURL(blob);
            }, 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load error')); };
        img.src = url;
    });
}

function openTelegramModal() {
    document.getElementById('tg-token-input').value  = TG_TOKEN;
    document.getElementById('tg-chatid-input').value = TG_CHAT_ID;
    document.getElementById('telegram-modal').classList.replace('hidden', 'flex');
}

function closeTelegramModalIfConfigured() {
    if (TG_TOKEN && TG_CHAT_ID) document.getElementById('telegram-modal').classList.replace('flex', 'hidden');
}

function saveTelegramConfig() {
    TG_TOKEN   = document.getElementById('tg-token-input').value.trim();
    TG_CHAT_ID = document.getElementById('tg-chatid-input').value.trim();
    localStorage.setItem('tg_token', TG_TOKEN);
    localStorage.setItem('tg_chat_id', TG_CHAT_ID);
    document.getElementById('telegram-modal').classList.replace('flex', 'hidden');
}

window.refreshTelegramImage = async function(img, fileId) {
    if (!fileId || img.dataset.retried || !TG_TOKEN) { img.style.display = 'none'; return; }
    img.dataset.retried = 'true';
    try {
        const resp = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/getFile?file_id=${fileId}`);
        const data = await resp.json();
        if (data.ok) img.src = `https://api.telegram.org/file/bot${TG_TOKEN}/${data.result.file_path}`;
        else img.style.display = 'none';
    } catch(e) { img.style.display = 'none'; }
};

proj4.defs("EPSG:25831","+proj=utm +zone=31 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
function wgs84ToUtm31(lon, lat) {
    const [x,y] = proj4("EPSG:4326","EPSG:25831",[lon,lat]);
    return { x: Math.round(x*100)/100, y: Math.round(y*100)/100 };
}

async function uploadPhotoToTelegram(blob, numPunt, fotoIndex) {
    if (!TG_TOKEN || !TG_CHAT_ID) return null;
    try {
        const fd = new FormData();
        fd.append('chat_id', TG_CHAT_ID);
        fd.append('photo', blob, `p${numPunt}_f${fotoIndex}.jpg`);  // 'photo' en lloc de 'document'
        
        const resp = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, {  // sendPhoto
            method: 'POST', body: fd
        });
        const data = await resp.json();
        if (!data.ok) return null;

        // sendPhoto retorna un array de mides, agafem la més gran
        const photos = data.result.photo;
        const biggest = photos[photos.length - 1];
        const fileId = biggest.file_id;

        const fileResp = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/getFile?file_id=${fileId}`);
        const fileData = await fileResp.json();
        return { 
            fileId, 
            fileUrl: `https://api.telegram.org/file/bot${TG_TOKEN}/${fileData.result.file_path}` 
        };
    } catch(err) { return null; }
}

// handlePhoto: comprimit PRIMER, DESPRÉS previsualitza i desa
// ─────────────────────────────────────────────────────────────
async function handlePhoto(event) {
    const files = event.target.files;
    if (!files.length) return;

    const quality  = parseFloat(document.getElementById('quality-select').value) || 0.7;
    const maxDim   = 1024;
    const pc       = document.getElementById('photo-preview-container');
    const statusEl = document.getElementById('photo-status');
    pc.classList.remove('hidden');

    const targetPointNum = getNextPointNumber();

    for (let i = 0; i < files.length; i++) {
        statusEl.innerText = `⏳ Comprimint foto ${i + 1}/${files.length}...`;

        let compressed;
        try {
            compressed = await compressImage(files[i], quality, maxDim);
        } catch (e) {
            showNotification(`Error comprimint foto ${i+1}`, true);
            continue;
        }

        // Guardem el blob comprimit
        currentPhotosFiles.push(compressed);

        // Previsualització: URL temporal, alliberat quan ja s'ha carregat
        const previewUrl = URL.createObjectURL(compressed);
        const img = document.createElement('img');
        img.src = previewUrl;
        img.className = "rounded-lg max-h-24 object-cover w-full border";
        img.onload = () => URL.revokeObjectURL(previewUrl);
        pc.appendChild(img);

        // Descàrrega diferida: no bloqueja el fil principal ni la previsualització
        const dateString = new Date().toISOString().slice(0,19).replace(/[-T:]/g,"_");
        const filename = `inspeccio_punt_${targetPointNum}_${dateString}_${i+1}.jpg`;
        const blobCopy = compressed.slice(0); // còpia independent per a la descàrrega
        setTimeout(() => savePhotoLocally(blobCopy, filename), 300 * (i + 1));
    }

    const totalKB = currentPhotosFiles.reduce((s, b) => s + b.size, 0) / 1024;
    statusEl.innerText = `${currentPhotosFiles.length} foto(es) ✓ (~${Math.round(totalKB)} KB total)`;
    event.target.value = '';
}


async function savePoint() {
    if (currentLat===null) { showNotification("GPS?",true); return; }
    const isEdit = editingPointId !== null;
    const revisat = document.getElementById('revisat').checked;
    const estatR = document.querySelector('input[name="estat"]:checked');

    let f = isEdit ? savedPoints.find(feat => feat.id === editingPointId) : {
        type:"Feature", id:Date.now().toString(),
        geometry:{type:"Point",coordinates:[currentLon, currentLat]},
        properties:{ num_punt:getNextPointNumber(), n_fotos:0, foto_urls:[], foto_ids:[] }
    };

    f.geometry.coordinates = [currentLon, currentLat];
    f.properties.revisat = revisat;
    f.properties.codi = document.getElementById('codi').value.trim();
    f.properties.tipus = document.getElementById('tipus').value;
    f.properties.estat = estatR ? estatR.value : '';
    f.properties.notes = document.getElementById('notes').value.trim();
    f.properties.data_hora = new Date().toISOString();

    if (!isEdit) savedPoints.push(f);

    // PRIMER: desa el punt sense fotos (segur contra crashes)
    localStorage.setItem('inspeccions_qgis', JSON.stringify(savedPoints));
    refreshMapMarkers();
    closeAllPanels();
    showNotification("✅ Punt desat!");

    // DESPRÉS: puja fotos a Telegram en segon pla (no bloqueja la UI)
    if (currentPhotosFiles.length > 0 && TG_TOKEN && TG_CHAT_ID) {
        showNotification("📤 Pujant fotos...");
        let fotosOk = 0;
        for (let i=0; i<currentPhotosFiles.length; i++) {
            const r = await uploadPhotoToTelegram(currentPhotosFiles[i], f.properties.num_punt, f.properties.n_fotos + 1);
            if (r) {
                f.properties.foto_urls.push(r.fileUrl);
                f.properties.foto_ids.push(r.fileId);
                f.properties.n_fotos++;
                fotosOk++;
            }
        }
        if (fotosOk > 0) {
            // Actualitza localStorage amb les URLs de Telegram
            localStorage.setItem('inspeccions_qgis', JSON.stringify(savedPoints));
            showNotification(`📎 ${fotosOk} foto(es) pujades`);
        }
    }
}

// ─────────────────────────────────────────────────────────────
// VISOR DE FOTOS AMB ZOOM
// ─────────────────────────────────────────────────────────────
let viewerScale = 1, viewerMinScale = 1, viewerMaxScale = 5;
let viewerOffsetX = 0, viewerOffsetY = 0;
let viewerDragging = false, viewerLastX = 0, viewerLastY = 0;
let viewerLastDist = null;

function applyViewerTransform() {
    const img = document.getElementById('photo-viewer-img');
    img.style.transform = `translate(${viewerOffsetX}px, ${viewerOffsetY}px) scale(${viewerScale})`;
}

function clampViewerOffset() {
    const img = document.getElementById('photo-viewer-img');
    const maxX = (img.naturalWidth  * viewerScale - window.innerWidth)  / 2;
    const maxY = (img.naturalHeight * viewerScale - window.innerHeight) / 2;
    viewerOffsetX = Math.max(-Math.max(maxX,0), Math.min(Math.max(maxX,0), viewerOffsetX));
    viewerOffsetY = Math.max(-Math.max(maxY,0), Math.min(Math.max(maxY,0), viewerOffsetY));
}

function openPhotoViewer(url, fileId) {
    const modal = document.getElementById('photo-viewer-modal');
    const img   = document.getElementById('photo-viewer-img');
    viewerScale = 1; viewerOffsetX = 0; viewerOffsetY = 0;
    img.style.transition = 'none';
    applyViewerTransform();
    img.src = '';
    img.src = url;
    img.dataset.retried = '';
    img.onerror = () => {
        if (fileId && !img.dataset.retried) {
            img.dataset.retried = 'true';
            refreshTelegramImage(img, fileId);
        }
    };
    modal.classList.replace('hidden', 'flex');
    lucide.createIcons();
}

function closePhotoViewer() {
    document.getElementById('photo-viewer-modal').classList.replace('flex', 'hidden');
    document.getElementById('photo-viewer-img').src = '';
}

function resetViewerZoom() {
    viewerScale = 1; viewerOffsetX = 0; viewerOffsetY = 0;
    const img = document.getElementById('photo-viewer-img');
    img.style.transition = 'transform 0.2s ease';
    applyViewerTransform();
    setTimeout(() => img.style.transition = 'none', 200);
}

// Inicialització dels esdeveniments del visor de fotos
(function() {
    const container = document.getElementById('photo-viewer-container');
    if (!container) return;

    container.addEventListener('wheel', e => {
        if (!document.getElementById('photo-viewer-modal').classList.contains('flex')) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.85 : 1.15;
        viewerScale = Math.min(viewerMaxScale, Math.max(viewerMinScale, viewerScale * delta));
        clampViewerOffset();
        applyViewerTransform();
    }, { passive: false });

    container.addEventListener('dblclick', e => {
        if (e.target.id === 'photo-viewer-img') resetViewerZoom();
    });

    container.addEventListener('mousedown', e => {
        if (viewerScale <= 1) return;
        viewerDragging = true;
        viewerLastX = e.clientX; viewerLastY = e.clientY;
        container.style.cursor = 'grabbing';
    });
    
    window.addEventListener('mousemove', e => {
        if (!viewerDragging) return;
        viewerOffsetX += e.clientX - viewerLastX;
        viewerOffsetY += e.clientY - viewerLastY;
        viewerLastX = e.clientX; viewerLastY = e.clientY;
        clampViewerOffset();
        applyViewerTransform();
    });
    
    window.addEventListener('mouseup', () => {
        viewerDragging = false;
        container.style.cursor = viewerScale > 1 ? 'grab' : 'default';
    });

    container.addEventListener('click', e => {
        if (e.target === container) closePhotoViewer();
    });

    container.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
            viewerLastDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        } else if (e.touches.length === 1 && viewerScale > 1) {
            viewerDragging = true;
            viewerLastX = e.touches[0].clientX;
            viewerLastY = e.touches[0].clientY;
        }
    }, { passive: true });

    container.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && viewerLastDist !== null) {
            e.preventDefault();
            const dist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const delta = dist / viewerLastDist;
            viewerScale = Math.min(viewerMaxScale, Math.max(viewerMinScale, viewerScale * delta));
            viewerLastDist = dist;
            clampViewerOffset();
            applyViewerTransform();
        } else if (e.touches.length === 1 && viewerDragging) {
            viewerOffsetX += e.touches[0].clientX - viewerLastX;
            viewerOffsetY += e.touches[0].clientY - viewerLastY;
            viewerLastX = e.touches[0].clientX;
            viewerLastY = e.touches[0].clientY;
            clampViewerOffset();
            applyViewerTransform();
        }
    }, { passive: false });

    container.addEventListener('touchend', e => {
        if (e.touches.length < 2) viewerLastDist = null;
        if (e.touches.length === 0) viewerDragging = false;
    });
})();

// Funció inversa: d'UTM31 a WGS84 (per poder llegir el que exportem)
function utm31ToWgs84(x, y) {
    const [lon, lat] = proj4("EPSG:25831", "EPSG:4326", [x, y]);
    return { lat, lon };
}

// Funció per processar l'arxiu GeoJSON
function importGeoJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.type !== "FeatureCollection" || !data.features) {
                throw new Error("Format no vàlid");
            }

            const importedPoints = data.features.map(f => {
                // Convertim les coordenades X/Y de tornada a Lat/Lon
                const [x, y] = f.geometry.coordinates;
                const wgs84 = utm31ToWgs84(x, y);
                f.geometry.coordinates = [wgs84.lon, wgs84.lat];
                
                // Generem un nou ID intern per evitar conflictes
                f.id = Date.now().toString() + Math.floor(Math.random() * 1000);
                return f;
            });

            // Afegim els nous punts als que ja teníem
            savedPoints = savedPoints.concat(importedPoints);
            localStorage.setItem('inspeccions_qgis', JSON.stringify(savedPoints));
            
            refreshMapMarkers();
            closeAllPanels();
            showNotification(`✅ ${importedPoints.length} punts importats correctament!`);
            
        } catch (err) {
            showNotification("❌ Error al llegir l'arxiu GeoJSON", true);
            console.error(err);
        }
        event.target.value = ''; // Reseteja el camp d'arxiu
    };
    reader.readAsText(file);
}

// ─────────────────────────────────────────────────────────────
// DICTAT PER VEU (Speech to Text)
// ─────────────────────────────────────────────────────────────
let recognition = null;
let isRecording = false;

// Comprovem si el navegador del mòbil suporta el dictat
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'ca-ES'; // Idioma del dictat (català)
    recognition.continuous = false; // S'atura automàticament quan deixes de parlar
    recognition.interimResults = true;

    // Si hi ha suport, mostrem el botó amagat
    setTimeout(() => {
        const btn = document.getElementById('btn-dictate');
        if (btn) btn.classList.remove('hidden');
    }, 500);

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById('btn-dictate').classList.add('mic-recording');
        showNotification("🎙️ Escoltant... Parla ara", false);
    };

    recognition.onresult = (event) => {
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
            }
        }
        
        // Quan acabi de processar la frase, l'afegeix al final del que ja hi hagi escrit
        if (finalTranscript) {
            const notesEl = document.getElementById('notes');
            const currentText = notesEl.value;
            // Afegeix un espai si ja hi havia text previ
            notesEl.value = currentText + (currentText.length > 0 && !currentText.endsWith(' ') ? ' ' : '') + finalTranscript;
        }
    };

    recognition.onerror = (event) => {
        console.error("Error de dictat:", event.error);
        if (event.error === 'not-allowed') {
            showNotification("❌ Permís de micròfon denegat", true);
        }
        stopDictation();
    };

    recognition.onend = () => {
        stopDictation();
    };
}

function toggleDictation() {
    if (!recognition) {
        showNotification("El teu navegador no suporta el dictat", true);
        return;
    }
    
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
        } catch(e) {
            console.error(e);
        }
    }
}

function stopDictation() {
    isRecording = false;
    const btn = document.getElementById('btn-dictate');
    if (btn) btn.classList.remove('mic-recording');
}

window.onload = () => {
    // 1. Primer inicialitzem l'app normalment
    initMap(); 
    if (!TG_TOKEN) setTimeout(openTelegramModal, 600);

    // 2. Si venim des d'un enllaç extern (SIG), obrim el visor amb zoom
    const p = new URLSearchParams(window.location.search);
    if (p.get('view_img')) {
        openPhotoViewer(p.get('view_img'), p.get('file_id'));
    }
};
    
</script>
</body>
