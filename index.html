let map, userMarker, currentLat = null, currentLon = null;
let currentPhotosFiles = [];   // Ara guardarem Blobs comprimits, no File originals
let savedPoints = [];
let editingPointId = null;

let TG_TOKEN   = localStorage.getItem('tg_token')   || '';
let TG_CHAT_ID = localStorage.getItem('tg_chat_id') || '';

// ─────────────────────────────────────────────────────────────
// COMPRESSIÓ D'IMATGE AMB CANVAS
// Redimensiona a màx. 1600px i comprimeix a JPEG amb la qualitat triada.
// Allibera la memòria de l'objecte URL i de l'img temporal just després.
// ─────────────────────────────────────────────────────────────
function compressImage(file, quality, maxDim) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url); // allibera memòria immediatament

            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
                if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                else                { width  = Math.round(width  * maxDim / height); height = maxDim; }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(blob => {
                // Neteja el canvas per alliberar memòria de GPU/CPU
                canvas.width = 1; canvas.height = 1;
                if (blob) resolve(blob);
                else reject(new Error('toBlob failed'));
            }, 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load error')); };
        img.src = url;
    });
}

// ─────────────────────────────────────────────────────────────

function openTelegramModal() {
    document.getElementById('tg-token-input').value  = TG_TOKEN;
    document.getElementById('tg-chatid-input').value = TG_CHAT_ID;
    document.getElementById('telegram-modal').classList.replace('hidden', 'flex');
}

function closeTelegramModalIfConfigured() {
    if (TG_TOKEN && TG_CHAT_ID) document.getElementById('telegram-modal').classList.replace('flex', 'hidden');
}

function saveTelegramConfig() {
    TG_TOKEN   = document.getElementById('tg-token-input').value.trim();
    TG_CHAT_ID = document.getElementById('tg-chatid-input').value.trim();
    localStorage.setItem('tg_token', TG_TOKEN);
    localStorage.setItem('tg_chat_id', TG_CHAT_ID);
    document.getElementById('telegram-modal').classList.replace('flex', 'hidden');
}

window.refreshTelegramImage = async function(img, fileId) {
    if (!fileId || img.dataset.retried || !TG_TOKEN) { img.style.display = 'none'; return; }
    img.dataset.retried = 'true';
    try {
        const resp = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/getFile?file_id=${fileId}`);
        const data = await resp.json();
        if (data.ok) img.src = `https://api.telegram.org/file/bot${TG_TOKEN}/${data.result.file_path}`;
        else img.style.display = 'none';
    } catch(e) { img.style.display = 'none'; }
};

proj4.defs("EPSG:25831","+proj=utm +zone=31 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
function wgs84ToUtm31(lon, lat) {
    const [x,y] = proj4("EPSG:4326","EPSG:25831",[lon,lat]);
    return { x: Math.round(x*100)/100, y: Math.round(y*100)/100 };
}

async function uploadPhotoToTelegram(blob, numPunt, fotoIndex) {
    if (!TG_TOKEN || !TG_CHAT_ID) return null;
    try {
        const fd = new FormData();
        fd.append('chat_id', TG_CHAT_ID);
        fd.append('document', blob, `p${numPunt}_f${fotoIndex}.jpg`);
        const resp = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendDocument`, {method:'POST', body:fd});
        const data = await resp.json();
        if (!data.ok) return null;
        const fileId = data.result.document.file_id;
        const fileResp = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/getFile?file_id=${fileId}`);
        const fileData = await fileResp.json();
        return { fileId, fileUrl: `https://api.telegram.org/file/bot${TG_TOKEN}/${fileData.result.file_path}` };
    } catch(err) { return null; }
}

const backdrop = document.getElementById('backdrop');
const formPanel = document.getElementById('form-panel');
const toolsPanel = document.getElementById('tools-panel');

function getNextPointNumber() {
    const customStart = parseInt(localStorage.getItem('custom_start_num')) || 1;
    const nums = savedPoints.map(f=>f.properties.num_punt).filter(n=>typeof n==='number');
    return Math.max(customStart, (nums.length > 0 ? Math.max(...nums) : 0) + 1);
}

function updateCustomStartNum(val) {
    const num = parseInt(val);
    if(!isNaN(num) && num > 0) localStorage.setItem('custom_start_num', num);
}

function openNewPointForm() {
    editingPointId = null;
    document.getElementById('form-title-text').innerText = "Nou Punt";
    document.getElementById('btn-delete-point').classList.add('hidden');
    document.getElementById('new-point-id').innerText = `#${getNextPointNumber()}`;
    document.getElementById('revisat').checked = false;
    document.getElementById('codi').value = '';
    document.getElementById('tipus').value = '';
    document.getElementById('notes').value = '';
    document.querySelectorAll('input[name="estat"]').forEach(r=>r.checked=false);
    document.querySelectorAll('[id^=estat-]').forEach(l=>l.classList.remove('ring-2','ring-offset-1','ring-green-400','ring-yellow-400','ring-red-400','bg-green-50','bg-yellow-50','bg-red-50'));
    currentPhotosFiles=[];
    document.getElementById('photo-preview-container').innerHTML='';
    document.getElementById('photo-preview-container').classList.add('hidden');
    document.getElementById('photo-status').innerText = "Sense fotos noves";
    backdrop.classList.remove('hidden');
    setTimeout(()=>formPanel.classList.remove('translate-y-full'), 10);
}

function editPoint(id) {
    const f = savedPoints.find(feat => feat.id === id);
    if (!f) return;
    editingPointId = id;
    document.getElementById('form-title-text').innerText = "Editar Punt";
    document.getElementById('btn-delete-point').classList.remove('hidden');
    document.getElementById('new-point-id').innerText = `#${f.properties.num_punt}`;
    document.getElementById('revisat').checked = f.properties.revisat || false;
    document.getElementById('codi').value = f.properties.codi || '';
    document.getElementById('tipus').value = f.properties.tipus || '';
    document.getElementById('notes').value = f.properties.notes || '';
    if (f.properties.estat) {
        const r = document.querySelector(`input[name="estat"][value="${f.properties.estat}"]`);
        if (r) { r.checked = true; updateEstat(r); }
    }
    currentPhotosFiles=[];
    document.getElementById('photo-preview-container').innerHTML='';
    document.getElementById('photo-preview-container').classList.add('hidden');
    document.getElementById('edit-photo-info').innerText = f.properties.n_fotos > 0 ? `(${f.properties.n_fotos} prev.)` : "";
    map.closePopup();
    backdrop.classList.remove('hidden');
    setTimeout(()=>formPanel.classList.remove('translate-y-full'), 10);
    lucide.createIcons();
}

function deletePointById(id) {
    if(confirm("Eliminar punt?")) {
        savedPoints = savedPoints.filter(f => f.id !== id);
        localStorage.setItem('inspeccions_qgis', JSON.stringify(savedPoints));
        refreshMapMarkers();
        closeAllPanels();
    }
}

function deleteCurrentPoint() { if(editingPointId) deletePointById(editingPointId); }

function openToolsPanel() {
    document.getElementById('custom-start-num').value = getNextPointNumber();
    backdrop.classList.remove('hidden');
    setTimeout(()=>toolsPanel.classList.remove('translate-y-full'), 10);
}

function closeAllPanels() {
    formPanel.classList.add('translate-y-full');
    toolsPanel.classList.add('translate-y-full');
    setTimeout(()=>backdrop.classList.add('hidden'), 300);
}

function updateEstat(radio) {
    document.querySelectorAll('[id^=estat-]').forEach(l=>l.classList.remove('ring-2','ring-offset-1','ring-green-400','ring-yellow-400','ring-red-400','bg-green-50','bg-yellow-50','bg-red-50'));
    const c={bo:['ring-green-400','bg-green-50'],regular:['ring-yellow-400','bg-yellow-50'],dolent:['ring-red-400','bg-red-50']};
    const lbl = document.getElementById(`estat-${radio.value}-label`);
    if(lbl && c[radio.value]) lbl.classList.add('ring-2','ring-offset-1',...c[radio.value]);
}

function showNotification(msg, isError=false) {
    const area = document.getElementById('notification-area');
    const n = document.createElement('div');
    n.className = `notification ${isError?'error':''}`;
    n.innerText = msg;
    area.appendChild(n);
    setTimeout(()=>{ n.style.opacity='0'; setTimeout(()=>n.remove(),500); }, 3000);
}

function initMap() {
    map = L.map('map',{zoomControl:false}).setView([41.7286,1.8201],14);
    L.control.zoom({position:'topright'}).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
    map.on('click',e=>updatePosition(e.latlng.lat,e.latlng.lng));
    loadSavedPoints();
    locateUser();
}

function updatePosition(lat, lon) {
    currentLat = lat; currentLon = lon;
    const utm = wgs84ToUtm31(lon, lat);
    document.getElementById('lat-display').innerText = utm.x.toFixed(2)+' m';
    document.getElementById('lon-display').innerText = utm.y.toFixed(2)+' m';
    if (userMarker) userMarker.setLatLng([lat,lon]);
    else userMarker = L.marker([lat,lon],{icon:L.divIcon({className:'',html:"<div style='background:#3b82f6;width:14px;height:14px;border-radius:50%;border:2px solid white;'></div>",iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);
}

function locateUser() {
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(p=>{ updatePosition(p.coords.latitude,p.coords.longitude); map.flyTo([p.coords.latitude,p.coords.longitude],17); }, null, {enableHighAccuracy:true});
}

// Desa la foto comprimida localment
function savePhotoLocally(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ─────────────────────────────────────────────────────────────
// handlePhoto: comprimit PRIMER, DESPRÉS previsualitza i desa
// ─────────────────────────────────────────────────────────────
async function handlePhoto(event) {
    const files = event.target.files;
    if (!files.length) return;

    const quality  = parseFloat(document.getElementById('quality-select').value) || 0.7;
    const maxDim   = 1600; // píxels màxims per costat
    const pc       = document.getElementById('photo-preview-container');
    const statusEl = document.getElementById('photo-status');
    pc.classList.remove('hidden');

    const targetPointNum = getNextPointNumber();

    for (let i = 0; i < files.length; i++) {
        statusEl.innerText = `⏳ Comprimint foto ${i + 1}/${files.length}...`;

        let compressed;
        try {
            compressed = await compressImage(files[i], quality, maxDim);
        } catch (e) {
            showNotification(`Error comprimint foto ${i+1}`, true);
            continue;
        }

        // Afegim el Blob comprimit (no el File original)
        currentPhotosFiles.push(compressed);

        // Previsualització amb el blob comprimit
        const previewUrl = URL.createObjectURL(compressed);
        const img = document.createElement('img');
        img.src = previewUrl;
        img.className = "rounded-lg max-h-24 object-cover w-full border";
        // Allibera l'objecte URL quan la imatge ja s'ha carregat a la pantalla
        img.onload = () => URL.revokeObjectURL(previewUrl);
        pc.appendChild(img);

        // Desa localment la versió comprimida
        const dateString = new Date().toISOString().slice(0,19).replace(/[-T:]/g,"_");
        const filename = `inspeccio_punt_${targetPointNum}_${dateString}_${i+1}.jpg`;
        savePhotoLocally(compressed, filename);
    }

    const totalKB = currentPhotosFiles.reduce((s, b) => s + b.size, 0) / 1024;
    statusEl.innerText = `${currentPhotosFiles.length} foto(es) ✓ (~${Math.round(totalKB)} KB total)`;
    event.target.value = '';
}

async function savePoint() {
    if (currentLat===null) { showNotification("GPS?",true); return; }
    const isEdit = editingPointId !== null;
    const revisat = document.getElementById('revisat').checked;
    const estatR = document.querySelector('input[name="estat"]:checked');
    
    let f = isEdit ? savedPoints.find(feat => feat.id === editingPointId) : {
        type:"Feature", id:Date.now().toString(),
        geometry:{type:"Point",coordinates:[currentLon, currentLat]},
        properties:{ num_punt:getNextPointNumber(), n_fotos:0, foto_urls:[], foto_ids:[] }
    };

    f.geometry.coordinates = [currentLon, currentLat];
    f.properties.revisat = revisat;
    f.properties.codi = document.getElementById('codi').value.trim();
    f.properties.tipus = document.getElementById('tipus').value;
    f.properties.estat = estatR ? estatR.value : '';
    f.properties.notes = document.getElementById('notes').value.trim();
    f.properties.data_hora = new Date().toISOString();

    if (!isEdit) savedPoints.push(f);

    if (currentPhotosFiles.length > 0) {
        showNotification("📤 Pujant...");
        for (let i=0; i<currentPhotosFiles.length; i++) {
            const r = await uploadPhotoToTelegram(currentPhotosFiles[i], f.properties.num_punt, f.properties.n_fotos + 1);
            if (r) { f.properties.foto_urls.push(r.fileUrl); f.properties.foto_ids.push(r.fileId); f.properties.n_fotos++; }
        }
    }
    localStorage.setItem('inspeccions_qgis', JSON.stringify(savedPoints));
    refreshMapMarkers(); closeAllPanels();
}

function refreshMapMarkers() {
    map.eachLayer(l => { if (l instanceof L.Marker && l !== userMarker) map.removeLayer(l); });
    savedPoints.forEach(f => {
        const props = f.properties;
        const color = props.revisat ? '#3b82f6' : ({bo:'#22c55e',regular:'#f59e0b',dolent:'#ef4444'}[props.estat] || '#9ca3af');
        const icon = L.divIcon({className:'',html:`<div style="background:${color};width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.3);"></div>`,iconSize:[18,18],iconAnchor:[9,18]});
        const m = L.marker([f.geometry.coordinates[1], f.geometry.coordinates[0]],{icon}).addTo(map);
        
        let h = `<div class="popup-content"><div class="popup-id">#${props.num_punt} ${props.revisat?'(REVISAT)':''}</div>`;
        if(props.notes) h += `<div class="popup-row">${props.notes}</div>`;
        if(props.foto_urls?.length) h += `<img src="${props.foto_urls[0]}" onerror="refreshTelegramImage(this,'${props.foto_ids[0]}')" style="width:100%;border-radius:4px;margin-top:5px;">`;
        h += `<div style="text-align:right;margin-top:10px;display:flex;justify-content:flex-end;gap:8px;">
                <button onclick="deletePointById('${f.id}')" style="background:#ef4444;color:white;padding:5px;border-radius:5px;"><i data-lucide="trash-2" style="width:14px;"></i></button>
                <button onclick="editPoint('${f.id}')" style="background:#3b82f6;color:white;padding:5px 10px;border-radius:5px;font-weight:bold;">✏️ Edita</button>
              </div></div>`;
        m.bindPopup(h).on('popupopen',()=>lucide.createIcons());
    });
    document.getElementById('points-count').innerText=savedPoints.length;
}

function loadSavedPoints() {
    const s = localStorage.getItem('inspeccions_qgis');
    if(s) { savedPoints=JSON.parse(s); refreshMapMarkers(); }
}

function buildGeoJSONExport(features) {
    return { "type": "FeatureCollection", "crs": { "type": "name", "properties": { "name": "EPSG:25831" } }, "features": features };
}

function exportGeoJSONonly() {
    if(!savedPoints.length) return;
    const feats = JSON.parse(JSON.stringify(savedPoints));
    feats.forEach((f, i) => {
        f.id = parseInt(f.properties.num_punt) || (i + 1);
        const utm = wgs84ToUtm31(f.geometry.coordinates[0], f.geometry.coordinates[1]);
        f.geometry.coordinates = [utm.x, utm.y];
        f.properties.foto_urls = f.properties.foto_urls.join('|');
        f.properties.foto_ids = f.properties.foto_ids.join('|');
    });
    const b = new Blob([JSON.stringify(buildGeoJSONExport(feats),null,2)],{type:'application/geo+json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`insp_${new Date().getTime()}.geojson`; a.click();
}

async function exportDataAsZip() {
    if(!savedPoints.length) return;
    const zip = new JSZip();
    const feats = JSON.parse(JSON.stringify(savedPoints));
    feats.forEach((f, i) => {
        f.id = parseInt(f.properties.num_punt) || (i + 1);
        const utm = wgs84ToUtm31(f.geometry.coordinates[0], f.geometry.coordinates[1]);
        f.geometry.coordinates = [utm.x, utm.y];
        f.properties.foto_urls = f.properties.foto_urls.join('|');
    });
    zip.file("mapa.geojson", JSON.stringify(buildGeoJSONExport(feats)));
    const c = await zip.generateAsync({type:"blob"});
    const a = document.createElement('a'); a.href=URL.createObjectURL(c); a.download=`insp_${new Date().getTime()}.zip`; a.click();
}

function clearData() { if(confirm("Segur?")) { localStorage.removeItem('inspeccions_qgis'); location.reload(); } }

window.onload = () => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('view_img')) {
        document.body.innerHTML = `<div style="background:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
            <img src="${p.get('view_img')}" onerror="refreshTelegramImage(this,'${p.get('file_id')}')" style="max-width:100%;max-height:80vh;border-radius:8px;">
            <a href="${window.location.pathname}" style="margin-top:20px;padding:10px 20px;background:#2563eb;color:white;border-radius:8px;text-decoration:none;">Tornar</a>
        </div>`;
        return;
    }
    initMap(); if (!TG_TOKEN) setTimeout(openTelegramModal, 600);
};
